name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          # Path handling and non-ASCII file names behave differently on Windows.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The core logic and its regression tests deliberately do not depend on
      # torch, so CI stays fast and does not download several GB of weights.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest

  package:
    # A regular install, not an editable one. The default config used to live
    # outside the package, so this exact scenario failed on the first command
    # while the editable install CI used stayed green.
    name: Installed package works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl
      - name: Run from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          vie --version
          vie doctor
