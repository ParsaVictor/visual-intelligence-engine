name: Real models

# Everything in the main CI fakes the weights. This job loads the real ones, because
# a test double cannot tell you that a tokenizer needs different padding, that a
# threshold is on the wrong scale, or that two dependencies no longer agree. All of
# those happened here, and every unit test was green at the time.
on:
  workflow_dispatch:
  push:
    branches: ["release/**"]
  schedule:
    - cron: "17 4 * * 1"

jobs:
  full-stack:
    name: Full model stack on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU stack
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          pip install "torch==2.5.1" "torchvision==0.20.1" \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[models,cpu,ann,dev]" "transformers==4.46.3"
          pip install scikit-image
          pip freeze | grep -iE "^(torch|transformers|numpy|av|ultralytics|insightface|onnxruntime)"
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.insightface
            md_v5a.0.0.pt
            rtdetr-x.pt
          key: models-v2
      - name: Real-model test suite
        run: pytest -m models -o addopts="" -v --tb=short -s

      - name: Calibrate the default model
        if: always()
        run: |
          python scripts/fetch_calibration_data.py benchmarks/calibration-data
          python scripts/calibrate.py benchmarks/calibration-data \
            --model google/siglip-so400m-patch14-384 --out benchmarks/calibration-so400m.json
          python scripts/calibrate.py benchmarks/calibration-data \
            --model google/siglip-base-patch16-224 --out benchmarks/calibration-base.json

      - name: Benchmark
        if: always()
        run: python scripts/benchmark.py --encoder --out benchmarks/results-ci.json

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-results
          path: |
            benchmarks/*.json
